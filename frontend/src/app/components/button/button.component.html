<button
  [attr.type]="type()"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading() ? true : null"
  [class]="classes()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <span
      class="h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-current border-r-transparent"
      aria-hidden="true"
    ></span>
  }

  <span
    class="inline-flex items-center gap-2"
    [class.flex-row-reverse]="iconPosition() === 'right'"
  >
    <ng-content select="[buttonIcon]" />
    <ng-content />
  </span>
</button>
