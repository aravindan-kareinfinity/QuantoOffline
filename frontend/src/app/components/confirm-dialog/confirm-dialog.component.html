@if (dialog.request(); as req) {
  <div
    class="fixed inset-0 z-[70] flex items-center justify-center bg-black/40 p-4"
    role="presentation"
    (click)="respond(false)"
  >
    <div
      class="w-full max-w-sm rounded-xl bg-surface p-5 shadow-xl"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="req.title"
      (click)="$event.stopPropagation()"
    >
      <h2 class="text-sm font-semibold text-foreground">{{ req.title }}</h2>
      <p class="mt-2 text-sm text-muted">{{ req.message }}</p>

      <div class="mt-5 flex justify-end gap-2">
        <app-button variant="outline" size="sm" (clicked)="respond(false)">
          {{ req.cancelText }}
        </app-button>
        <app-button [variant]="req.danger ? 'danger' : 'primary'" size="sm" (clicked)="respond(true)">
          {{ req.confirmText }}
        </app-button>
      </div>
    </div>
  </div>
}
